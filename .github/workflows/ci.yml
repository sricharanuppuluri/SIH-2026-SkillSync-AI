name: SkillSync AI CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend: Lint, Format & Tests ─────────────────────────────────────────
  backend-checks:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: skillsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff — Lint Check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff — Format Check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Alembic — Verify Migration Head
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/skillsync_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          uv run alembic upgrade head
          uv run alembic heads
          uv run alembic current

      - name: Pytest — Backend Test Suite
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/skillsync_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: uv run pytest -v --tb=short

  # ─── Frontend: Lint, Typecheck, Tests & Build ───────────────────────────────
  frontend-checks:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint — Lint Check
        working-directory: frontend
        run: npm run lint

      - name: TypeScript — Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest — Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Next.js — Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
