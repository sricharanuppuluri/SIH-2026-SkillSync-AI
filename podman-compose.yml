services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: skillsync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skillsync_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: skillsync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: skillsync-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama:Z

volumes:
  postgres_data:
  redis_data:
  ollama_data:
